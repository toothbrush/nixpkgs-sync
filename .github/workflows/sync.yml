name: sync-nixpkgs

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# GITHUB_TOKEN only reaches this repo
permissions:
  id-token: write
  contents: write

concurrency:
  group: sync-nixpkgs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      SOURCE: https://github.com/NixOS/nixpkgs.git
      TARGET: entire://aws-ap-southeast-2.entire.io/et/toothbrush/nixpkgs
      # Unreleased git-sync main; pin a release later
      GIT_SYNC_VERSION: v0.10.1-0.20261105102341-633bccb3b30a
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Install git-sync
        run: go install "entire.io/entire/git-sync/cmd/git-sync@${GIT_SYNC_VERSION}"

      - uses: entireio/setup-entire@v1
        with:
          service-account: svc_01M6JDV1WP4PTGV5WBVAQDX3K5
          auth-url: https://au.auth.entire.io

      - name: Sync opted-in branches
        id: sync
        run: |
          set -euo pipefail
          # Map each branch to upstream/<branch>
          args=()
          while read -r b; do
            [ -z "$b" ] || [ "${b#\#}" != "$b" ] && continue
            args+=(--map "${b}:upstream/${b}")
          done < branches.txt
          git-sync sync --json "${args[@]}" "$SOURCE" "$TARGET" | tee result.json
          jq -e '.blocked == 0' result.json > /dev/null

      - name: Update README
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          ./render-readme.py result.json
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update sync status"
          git push origin HEAD:main
